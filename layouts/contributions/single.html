{{ define "main" }}
<section class="content">
  <div>
    <h2 class="small-caps text-primary">{{ .Title }}</h2>
    <div>{{ .Params.community }}</div>

    {{ if (isset .Params "alert_danger") }}
      <div class="alert alert-danger">{{ .Params.alert_danger }}</div>
    {{ end }}

    {{ if (isset .Params "alert_info") }}
      <div class="alert alert-info">{{ .Params.alert_info }}</div>
    {{ end }}

    {{ with .Params.image }}<img src="{{ . }}" style="max-height:300px;max-width:30%;" align="right"/>{{ end }}
    {{ .Content }}

    <p>{{ partial "techtags" . }}</p>
  </div>
</section>
{{ end }}
