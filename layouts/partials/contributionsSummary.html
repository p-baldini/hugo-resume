<!-- Entry type for contributions in the list -->
<div class="resume-item">
  <div class="resume-item-publication">
    <a class="entry-title" href="{{ .Permalink }}">{{ .Params.title }} <i class="fa-solid fa-link"></i></a>
    <div>{{ .Params.short_description }}&nbsp;—&nbsp;{{ .Params.community }}</div>
  </div>
  <div class="resume-date">
    <span class="text-primary">{{ .Params.date | dateFormat "January 2006" }}</span>
  </div>
</div>
